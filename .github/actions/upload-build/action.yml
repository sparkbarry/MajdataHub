name: RhythmHub upload build
description: >-
  Describes a finished game build (for macOS: already signed and notarized, if it is going to be) as a
  RhythmHub release manifest and uploads the build, unpacked, to the release bucket.
  Without `channel` it stops there and the "Publish game release" workflow in RhythmHub makes it live.
  With `channel` and `signing-key` it also signs the manifest and switches that channel to this version.
  The calling job needs `permissions: id-token: write`.

inputs:
  game:
    description: Feed directory, e.g. MajdataPlay or OurTaikoPlay.
    required: true
  platform:
    description: Windows or MacOS.
    required: true
  version:
    description: Release version; must start with a digit, e.g. 1.2.0 or 1.2.0-20261102-abc1234.
    required: true
  build-path:
    description: Directory that directly contains the .exe (Windows) or the .app (macOS).
    required: true
  entrypoint:
    description: MajdataPlay.exe, MajdataPlay.app, ...
    required: true
  min-launcher-version:
    description: Oldest RhythmHub launcher that can run this build.
    required: false
    default: ""
  role-arn:
    description: IAM role to assume through GitHub OIDC (the AWS_ROLE_ARN variable).
    required: true
  channel:
    description: Make the build live on this channel (stable, nightly, ...). Empty = upload only.
    required: false
    default: ""
  signing-key:
    description: Base64 Ed25519 private key (secrets.RHYTHMHUB_SIGNING_KEY). Required with channel.
    required: false
    default: ""
  key-id:
    required: false
    default: rhythmhub-2026
  prune-previous:
    description: >-
      Delete the version this channel pointed at before, unless another channel still points at it.
      Use for nightly so only the latest nightly build is kept.
    required: false
    default: "false"
  cdn:
    required: false
    default: https://distrib.sparkbarry.com
  bucket:
    required: false
    default: sparkbarry-public
  aws-region:
    required: false
    default: ap-northeast-1

runs:
  using: composite
  steps:
    # Prebuilt standalone rhythmhub-release from the "release-tool" release (release-tool.yml), so the
    # runner needs no .NET SDK. Unknown platforms fall back to building it from source.
    - name: Get release tool
      id: tool
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) rid=linux-x64 ;;
          Darwin-arm64) rid=osx-arm64 ;;
          *) rid="" ;;
        esac
        dir="$RUNNER_TEMP/rhythmhub-release"
        rm -rf "$dir" && mkdir -p "$dir"
        if [[ -n "$rid" ]] && curl -fsSL --retry 3 \
            "https://github.com/sparkbarry/RhythmHub/releases/download/release-tool/rhythmhub-release-$rid.tar.gz" \
            | tar -xz -C "$dir"; then
          echo "RHYTHMHUB_RELEASE=$dir/rhythmhub-release" >> "$GITHUB_ENV"
          echo "prebuilt=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No prebuilt rhythmhub-release for $(uname -s)-$(uname -m); building from source."
          echo "prebuilt=false" >> "$GITHUB_OUTPUT"
        fi
        df -h "$RUNNER_TEMP" | tail -1 | awk '{print "Free space on the runner temp volume: " $4}'

    - if: steps.tool.outputs.prebuilt != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build release tool from source
      if: steps.tool.outputs.prebuilt != 'true'
      shell: bash
      env:
        TOOL: ${{ github.action_path }}/../../../tools/RhythmHub.ReleaseTool
      run: |
        set -euo pipefail
        dotnet publish "$TOOL" -c Release -o "$RUNNER_TEMP/rhythmhub-release-src"
        echo "RHYTHMHUB_RELEASE=$RUNNER_TEMP/rhythmhub-release-src/RhythmHub.ReleaseTool" >> "$GITHUB_ENV"

    - name: Describe build
      shell: bash
      env:
        GAME: ${{ inputs.game }}
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
        BUILD_PATH: ${{ inputs.build-path }}
        ENTRYPOINT: ${{ inputs.entrypoint }}
        MIN_LAUNCHER: ${{ inputs.min-launcher-version }}
      run: |
        set -euo pipefail
        args=(stage --game "$GAME" --platform "$PLATFORM" --version "$VERSION"
              --input "$BUILD_PATH" --entrypoint "$ENTRYPOINT" --out "$RUNNER_TEMP/$VERSION.unsigned.json")
        if [[ -n "$MIN_LAUNCHER" ]]; then args+=(--min-launcher "$MIN_LAUNCHER"); fi
        "$RHYTHMHUB_RELEASE" "${args[@]}"

    # GitHub-hosted runners ship the AWS CLI; self-hosted ones (MajdataPlay's Macs) may not.
    - name: Ensure AWS CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null 2>&1; then
          aws --version
          exit 0
        fi
        python3 -m venv "$RUNNER_TEMP/awscli"
        "$RUNNER_TEMP/awscli/bin/pip" install --quiet awscli
        echo "$RUNNER_TEMP/awscli/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/awscli/bin/aws" --version

    - uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: rhythmhub-upload-${{ github.run_id }}

    - name: Upload to S3
      id: upload
      shell: bash
      env:
        PREFIX: s3://${{ inputs.bucket }}/${{ inputs.game }}/${{ inputs.platform }}
        BUCKET: ${{ inputs.bucket }}
        KEY: ${{ inputs.game }}/${{ inputs.platform }}/${{ inputs.version }}.json
        VERSION: ${{ inputs.version }}
        BUILD_PATH: ${{ inputs.build-path }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        # Published versions are immutable. With a channel, an already published version (for example the
        # same commit built for a tag and for main) is reused: the channel is simply pointed at it.
        if aws s3api head-object --bucket "$BUCKET" --key "$KEY" >/dev/null 2>&1; then
          if [[ -z "$CHANNEL" ]]; then
            echo "::error::$KEY is already published. Bump the version instead of overwriting a release."
            exit 1
          fi
          echo "$KEY is already published; reusing it."
          echo "already_published=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "already_published=false" >> "$GITHUB_OUTPUT"
        # Symlinks, permissions and empty directories travel in the manifest, not as S3 objects.
        aws s3 sync "$BUILD_PATH" "$PREFIX/$VERSION/" --no-follow-symlinks --only-show-errors \
          --cache-control "public, max-age=31536000, immutable"
        aws s3 cp "$RUNNER_TEMP/$VERSION.unsigned.json" "$PREFIX/$VERSION.unsigned.json" \
          --cache-control "no-cache" --content-type application/json --only-show-errors
        if [[ -z "$CHANNEL" ]]; then
          {
            echo "### Uploaded ${{ inputs.game }} ${{ inputs.platform }} $VERSION"
            echo "Not live yet. To release it, run **Publish game release** in sparkbarry/RhythmHub with"
            echo "game \`${{ inputs.game }}\`, platform \`${{ inputs.platform }}\`, version \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Sign and go live
      if: inputs.channel != ''
      shell: bash
      env:
        GO_LIVE: ${{ github.action_path }}/../../../tools/ci/go-live.sh
        RHYTHMHUB_SIGNING_KEY: ${{ inputs.signing-key }}
        KEY_ID: ${{ inputs.key-id }}
        BUCKET: ${{ inputs.bucket }}
        CDN: ${{ inputs.cdn }}
        GAME: ${{ inputs.game }}
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        BUILD_PATH: ${{ inputs.build-path }}
        MANIFEST_ALREADY_PUBLISHED: ${{ steps.upload.outputs.already_published }}
        PRUNE_PREVIOUS: ${{ inputs.prune-previous }}
      run: |
        set -euo pipefail
        if [[ -z "$RHYTHMHUB_SIGNING_KEY" ]]; then
          echo "::error::signing-key is required with channel (secrets.RHYTHMHUB_SIGNING_KEY)."
          exit 1
        fi
        export DIR="$RUNNER_TEMP/feed/$GAME/$PLATFORM"
        mkdir -p "$DIR"
        if [[ "$MANIFEST_ALREADY_PUBLISHED" == "true" ]]; then
          aws s3 cp "s3://$BUCKET/$GAME/$PLATFORM/$VERSION.json" "$DIR/$VERSION.json" --only-show-errors
        else
          cp "$RUNNER_TEMP/$VERSION.unsigned.json" "$DIR/"
          # The files were just uploaded from here; checking them locally avoids downloading the build again.
          ln -sfn "$(cd "$BUILD_PATH" && pwd)" "$DIR/$VERSION"
        fi
        "$RHYTHMHUB_RELEASE" publish --feed "$RUNNER_TEMP/feed" \
          --game "$GAME" --platform "$PLATFORM" --version "$VERSION" --channel "$CHANNEL" --key-id "$KEY_ID"
        bash "$GO_LIVE"
